name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Playwright browsers (~1.5GB) are cached across runs; the key is tied to
      # package-lock.json, so any dependency bump that changes the Playwright
      # version busts the cache automatically.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # Builds the static bundle, then runs both headless projects in parallel
      # against `vite preview` (see playwright.config.js CI branch).
      - name: Run e2e suites
        run: npm run test:e2e:ci

      - name: Upload Playwright trace on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore